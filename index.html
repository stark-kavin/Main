<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage Tourism</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Sacramento&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: url('https://source.unsplash.com/1600x900/?vintage,travel') no-repeat center center/cover;
            font-family: 'Playfair Display', serif;
            color: #fff;
            text-align: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .title {
            font-size: 4rem;
            font-family: 'Sacramento', cursive;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .slogan {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Vintage Tourism</h1>
        <p class="slogan">DISCOVERING THE UNEXPLORED CORNER</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Welcome to Vintage Tourism!');
        });
    </script>
</body>
</html>
